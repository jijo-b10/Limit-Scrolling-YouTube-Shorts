<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Toggle + Stepper</title>
<style>
  :root{
    --ink: #2b2b2b;
    --paper: #f4f5f3;
    --line: #d7d7d7;
    --accent: #4cd964;
    --danger: #e2574c;
  }


  body{
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  .card{
    display: flex;
    align-items: center;
    padding: 10px 10px;
    background: #fff;
    box-shadow: 0 15px 24px -12px rgba(0, 0, 0, 0.15);
  }

  /* ---------- Checkbox (user-provided toggle) ---------- */
  .checkbox-wrapper-5 .check {
    --size: 60px;
    position: relative;
    background: linear-gradient(to bottom, #4cd964, #5de24e);
    line-height: 0;
    perspective: 400px;
    font-size: var(--size);
  }

  .checkbox-wrapper-5 .check input[type="checkbox"],
  .checkbox-wrapper-5 .check label,
  .checkbox-wrapper-5 .check label::before,
  .checkbox-wrapper-5 .check label::after,
  .checkbox-wrapper-5 .check {
    appearance: none;
    display: inline-block;
    border-radius: var(--size);
    border: 0;
    transition: .35s ease-in-out;
    box-sizing: border-box;
    cursor: pointer;
  }

  .checkbox-wrapper-5 .check label {
    width: calc(2.2 * var(--size));
    height: var(--size);
    background: #d7d7d7;
    overflow: hidden;
  }

  .checkbox-wrapper-5 .check input[type="checkbox"] {
    position: absolute;
    z-index: 1;
    width: calc(.8 * var(--size));
    height: calc(.8 * var(--size));
    top: calc(.1 * var(--size));
    left: calc(.1 * var(--size));
    background: linear-gradient(45deg, #dedede, #ffffff);
    box-shadow: 0 6px 7px rgba(0,0,0,0.3);
    outline: none;
    margin: 0;
  }

  .checkbox-wrapper-5 .check input[type="checkbox"]:checked {
    left: calc(1.3 * var(--size));
  }

  .checkbox-wrapper-5 .check input[type="checkbox"]:checked + label {
    background: transparent;
  }

  .checkbox-wrapper-5 .check label::before,
  .checkbox-wrapper-5 .check label::after {
    content: "· ·";
    position: absolute;
    overflow: hidden;
    left: calc(.15 * var(--size));
    top: calc(.5 * var(--size));
    height: var(--size);
    letter-spacing: calc(-0.04 * var(--size));
    color: #9b9b9b;
    font-family: "Times New Roman", serif;
    z-index: 2;
    font-size: calc(.6 * var(--size));
    border-radius: 0;
    transform-origin: 0 0 calc(-0.5 * var(--size));
    backface-visibility: hidden;
  }

  .checkbox-wrapper-5 .check label::after {
    content: "●";
    top: calc(.65 * var(--size));
    left: calc(.2 * var(--size));
    height: calc(.1 * var(--size));
    width: calc(.35 * var(--size));
    font-size: calc(.2 * var(--size));
    transform-origin: 0 0 calc(-0.4 * var(--size));
  }

  .checkbox-wrapper-5 .check input[type="checkbox"]:checked + label::before,
  .checkbox-wrapper-5 .check input[type="checkbox"]:checked + label::after {
    left: calc(1.55 * var(--size));
    top: calc(.4 * var(--size));
    line-height: calc(.1 * var(--size));
    transform: rotateY(360deg);
  }

  .checkbox-wrapper-5 .check input[type="checkbox"]:checked + label::after {
    height: calc(.16 * var(--size));
    top: calc(.55 * var(--size));
    left: calc(1.6 * var(--size));
    font-size: calc(.6 * var(--size));
    line-height: 0;
  }

  .checkbox-wrapper-5 .check input:focus-visible + label{
    outline: 2px solid #2f7a4c;
    outline-offset: 2px;
  }

  /* ---------- Stepper (matched to the toggle's rounded, pill-based feel) ---------- */
  .input-group{
    display: flex;
    align-items: stretch;
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
    height: 40px;
  }

  .input-group-btn .btn{
    width: 40px;
    height: 40px;
    border: none;
    background: #fff;
    font-size: 18px;
    line-height: 1;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .btn-danger{ color: var(--danger); }
  .btn-danger:hover{ background: #fbe9e7; }
  .btn-danger:disabled{ color: #c9c9c9; cursor: not-allowed; background: #fff; }

  .btn-success{ color: #2f9e4f; }
  .btn-success:hover{ background: #e6f7ea; }
  .btn-success:disabled{ color: #c9c9c9; cursor: not-allowed; background: #fff; }

  .btn:focus-visible{
    outline: 2px solid #2f7a4c;
    outline-offset: -2px;
  }

  #input-5{
    width: 44px !important;
    border: none;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
    text-align: center;
    font-size: 15px;
    color: var(--ink);
    background: #fff;
  }

  #input-5:focus{
    outline: none;
    background: #f4f9f5;
  }
</style>
</head>
<body>

<div class="card" style="flex-direction: column;">
  <div class="checkbox-wrapper-5">
    <div class="check">
      <input id="check-5" type="checkbox">
       <label for="check-5"></label>
    </div>
  </div>
  <div class="input-group">
    <span class="input-group-btn">
      <button type="button" class="btn btn-danger" id="decrement">−</button>
    </span>
    <input id="input-5" class="form-control" type="text" value="1" min="1" max="10" inputmode="numeric">
    <span class="input-group-btn">
      <button type="button" class="btn btn-success" id="increment">+</button>
    </span>
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
